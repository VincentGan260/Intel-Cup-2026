<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骑手前向安全预警 Dashboard</title>
<style>
  /* ── iOS 26 Liquid Glass Theme ── */
  :root {
    --bg: #f2f2f7;
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #aeaeb2;

    --blue: #007aff;
    --green: #34c759;
    --yellow: #ff9f0a;
    --red: #ff3b30;
    --orange: #ff9500;

    --green-subtle: rgba(52,199,89,0.1);
    --yellow-subtle: rgba(255,159,10,0.1);
    --red-subtle: rgba(255,59,48,0.1);

    --glass-border-radius: 16px;

    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    --font-mono: "SF Mono", "Menlo", "Monaco", "JetBrains Mono", monospace;

    --ease-apple: cubic-bezier(0.32, 0.72, 0, 1);
    --dur-fast: 150ms;
    --dur-normal: 250ms;
    --dur-slow: 400ms;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    animation: pageFadeIn var(--dur-slow) var(--ease-apple) both;
  }

  /* ── Liquid Glass Mixin ── */
  /* Core: translucent tinted bg + blur + saturate */
  /* + inset box-shadow for light/dark edge highlights */
  /* + radial gradient for specular highlight on top-left */
  @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cardSlideUp {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes scoreReveal {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes scoreBreathing {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.82; }
  }
  @keyframes indicatorPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  @keyframes dotPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.8); opacity: 0.3; }
  }
  @keyframes overlayFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes overlayBoxScale {
    from { opacity: 0; transform: scale(0.92) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes labelSlideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  /* Subtle shimmer on glass surfaces */
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── Header: Liquid Glass ── */
  .header {
    position: relative;
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    border-bottom: 0.5px solid rgba(0,0,0,0.06);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    z-index: 10;
    animation: pageFadeIn var(--dur-slow) var(--ease-apple) both;
  }
  /* Light top edge, dark bottom edge */
  .header::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    box-shadow:
      inset 1px 1px 0px 0px rgba(255,255,255,0.6),
      inset -1px -1px 0px 0px rgba(255,255,255,0.4);
    background:
      radial-gradient(circle at top left, rgba(255,255,255,0.25), transparent 25%),
      radial-gradient(circle at top right, rgba(255,255,255,0.15), transparent 20%);
  }
  .header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .header .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 980px;
    background: var(--green-subtle);
    font-size: 12px;
    font-weight: 500;
    color: var(--green);
    transition: all 0.3s var(--ease-apple);
    position: relative;
  }
  /* Glass pill: light edge highlight */
  .header .status-pill::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 980px;
    pointer-events: none;
    box-shadow:
      inset 1px 1px 0px 0px rgba(255,255,255,0.5),
      inset -1px -1px 0px 0px rgba(255,255,255,0.3);
  }
  .header .status-pill.offline {
    background: var(--red-subtle);
    color: var(--red);
  }
  .header .status-pill-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    animation: dotPulse 2.5s ease-in-out infinite;
  }
  .header .status-pill.offline .status-pill-dot { animation: none; }

  /* ── Main Layout ── */
  .main {
    display: flex;
    height: calc(100vh - 52px);
  }

  /* ── Video Column ── */
  .video-col {
    flex: 0 0 70%;
    min-width: 0;
    background: #1c1c1e;
    position: relative;
    overflow: hidden;
  }
  .video-wrapper {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-wrapper img {
    display: block;
    width: 100%; height: 100%;
    object-fit: contain;
    transition: filter 0.6s var(--ease-apple);
  }
  .video-wrapper canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  /* Ambient glow */
  .video-col::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(0,122,255,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(255,149,0,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 1;
    opacity: 0.7;
  }
  .video-label {
    position: absolute;
    bottom: 16px;
    left: 20px;
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 5;
    animation: labelSlideUp 0.5s var(--ease-apple) 0.6s both;
  }
  .video-mode-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: rgba(255,255,255,0.55);
    padding: 5px 14px;
    border-radius: 980px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: all 0.25s var(--ease-apple);
    position: relative;
    overflow: hidden;
  }
  /* Glass button shimmer */
  .video-mode-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 980px;
    pointer-events: none;
    box-shadow:
      inset 1px 1px 0px 0px rgba(255,255,255,0.25),
      inset -1px -1px 0px 0px rgba(255,255,255,0.15);
  }
  .video-mode-btn.active {
    background: rgba(0,122,255,0.22);
    color: #4dacff;
  }
  .video-mode-btn:hover { opacity: 0.85; transform: scale(1.02); }
  .video-mode-btn:active { transform: scale(0.98); }

  /* ── Panel Wrapper: Colorful backdrop for glass refraction ── */
  .panel-wrapper {
    flex: 0 0 30%;
    min-width: 320px;
    position: relative;
    overflow: hidden;
  }
  /* Rich gradient — gives the glass something to refract */
  .panel-wrapper::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(165deg,
        #a8d8ff 0%,
        #c2e9ff 12%,
        #e8d5f5 24%,
        #f5e6cc 36%,
        #b8e6d0 48%,
        #d4c5f9 60%,
        #fce4ec 72%,
        #c9e4f9 84%,
        #e0f0ff 100%
      );
    z-index: 0;
  }

  /* ── Panel: Liquid Glass Surface ── */
  .panel {
    position: relative;
    z-index: 1;
    height: 100%;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    /* Liquid Glass: low opacity + blur + saturate */
    background: rgba(255,255,255,0.32);
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    scrollbar-width: thin;
    scrollbar-color: rgba(0,0,0,0.06) transparent;
  }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-track { background: transparent; }
  .panel::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 3px; }

  /* ── Card: Liquid Glass Element ── */
  .card {
    position: relative;
    width: 100%;
    min-width: 0;
    background: rgba(255,255,255,0.32);
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    border: none;
    border-radius: var(--glass-border-radius);
    padding: 16px;
    flex-shrink: 0;
    /* All glass rim-light effects as inset box-shadow (no pseudo-elements) */
    box-shadow:
      inset 1px 1px 0px 0px rgba(255,255,255,0.5),
      inset -1px -1px 0px 0px rgba(255,255,255,0.3),
      inset 2px 2px 6px 1px rgba(255,255,255,0.12),
      inset -2px -2px 4px -1px rgba(255,255,255,0.08),
      0 1px 3px rgba(0,0,0,0.04);
    transition:
      background 0.3s var(--ease-apple),
      transform 0.3s var(--ease-apple),
      box-shadow 0.3s var(--ease-apple);
    animation: cardSlideUp 0.5s var(--ease-apple) both;
  }
  .card:nth-child(1)  { animation-delay: 0.06s; }
  .card:nth-child(2)  { animation-delay: 0.12s; }
  .card:nth-child(3)  { animation-delay: 0.18s; }
  .card:nth-child(4)  { animation-delay: 0.24s; }
  .card:nth-child(5)  { animation-delay: 0.30s; }
  .card:nth-child(6)  { animation-delay: 0.36s; }
  .card:nth-child(7)  { animation-delay: 0.42s; }
  .card:nth-child(8)  { animation-delay: 0.48s; }

  .card:hover {
    background: rgba(255,255,255,0.45);
    transform: translateY(-2px);
    box-shadow:
      inset 1px 1px 0px 0px rgba(255,255,255,0.5),
      inset -1px -1px 0px 0px rgba(255,255,255,0.3),
      inset 2px 2px 6px 1px rgba(255,255,255,0.12),
      inset -2px -2px 4px -1px rgba(255,255,255,0.08),
      0 8px 24px rgba(0,0,0,0.06),
      0 2px 6px rgba(0,0,0,0.03);
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  /* ── Risk Score ── */
  .risk-main { text-align: center; padding: 20px 16px; }
  .risk-score {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    margin: 4px 0;
    background: linear-gradient(135deg, var(--text-primary), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: scoreReveal 0.8s var(--ease-apple) 0.2s both;
    transition: transform 0.4s var(--ease-apple);
  }
  .risk-score.pulse {
    animation: scoreReveal 0.35s var(--ease-apple) both, scoreBreathing 3s ease-in-out infinite;
  }
  .risk-level-badge {
    display: inline-block;
    padding: 5px 16px;
    border-radius: 980px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 6px;
    transition: all 0.35s var(--ease-apple);
    position: relative;
  }
  /* Glass badge rim light */
  .risk-level-badge::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 980px;
    pointer-events: none;
    box-shadow:
      inset 1px 1px 0px 0px rgba(255,255,255,0.5),
      inset -1px -1px 0px 0px rgba(255,255,255,0.3);
  }
  .risk-level-badge.low { background: var(--green-subtle); color: var(--green); }
  .risk-level-badge.med { background: var(--yellow-subtle); color: var(--orange); }
  .risk-level-badge.high { background: var(--red-subtle); color: var(--red); }

  /* ── Progress Bar ── */
  .risk-bar-track {
    margin-top: 14px;
    height: 6px;
    border-radius: 3px;
    background: rgba(0,0,0,0.04);
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
  }
  .risk-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s var(--ease-apple), background 0.5s var(--ease-apple);
    /* Glass bar: subtle inner light on top */
    box-shadow: inset 0 1px 0px 0px rgba(255,255,255,0.3);
  }

  /* ── Risk Items ── */
  .risk-item-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .risk-item-row:last-child { margin-bottom: 0; }
  .risk-item-label { width: 60px; color: var(--text-secondary); font-size: 13px; }
  .risk-item-bar {
    flex: 1; margin: 0 12px;
    height: 4px; border-radius: 2px;
    background: rgba(0,0,0,0.04);
    overflow: hidden;
  }
  .risk-item-fill {
    height: 100%; border-radius: 2px;
    background: var(--blue);
    transition: width 0.45s var(--ease-apple);
    box-shadow: inset 0 1px 0px 0px rgba(255,255,255,0.25);
  }
  .risk-item-val {
    width: 40px; text-align: right;
    font-family: var(--font-mono);
    font-size: 12px; font-weight: 500;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }

  /* ── Sensor Status ── */
  .sensor-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .sensor-row:last-child { margin-bottom: 0; }
  .sensor-left { display: flex; align-items: center; gap: 10px; }
  .sensor-indicator {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    transition: all 0.35s var(--ease-apple);
  }
  .sensor-indicator.on {
    background: var(--green);
    box-shadow: 0 0 8px rgba(52,199,89,0.5), 0 0 20px rgba(52,199,89,0.15);
    animation: indicatorPulse 2.5s ease-in-out infinite;
  }
  .sensor-indicator.off { background: var(--red); box-shadow: 0 0 4px rgba(255,59,48,0.3); }
  .sensor-indicator.mock { background: var(--yellow); box-shadow: 0 0 4px rgba(255,159,10,0.25); }
  .sensor-mode {
    font-size: 12px; font-family: var(--font-mono);
    color: var(--text-tertiary);
    transition: color 0.3s var(--ease-apple);
  }

  /* ── Vision Details ── */
  .vd-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .vd-row:last-child { margin-bottom: 0; }
  .vd-label { color: var(--text-secondary); min-width: 100px; font-size: 13px; }
  .vd-val {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-family: var(--font-mono);
    font-size: 12px; font-weight: 500;
    color: var(--text-primary);
    transition: color 0.3s var(--ease-apple);
  }
  .vd-bar {
    flex: 1; margin: 0 10px;
    height: 4px; border-radius: 2px;
    background: rgba(0,0,0,0.04);
    overflow: hidden;
  }
  .vd-bar-fill {
    height: 100%; border-radius: 2px;
    background: var(--blue);
    transition: width 0.45s var(--ease-apple);
    box-shadow: inset 0 1px 0px 0px rgba(255,255,255,0.25);
  }

  /* ── Runtime / IMU ── */
  .sensor-label { color: var(--text-secondary); font-size: 13px; }
  .imu-val {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--text-primary);
    transition: color 0.3s var(--ease-apple);
  }

  /* ── Mode Card ── */
  .mode-row { display: flex; align-items: center; gap: 10px; }

  /* ── System Message Card ── */
  .sys-msg-card {
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    box-shadow:
      inset 1px 1px 0px 0px rgba(255,255,255,0.35),
      inset -1px -1px 0px 0px rgba(255,255,255,0.2);
    padding: 8px 16px;
  }
  .sys-msg-card:hover {
    background: rgba(255,255,255,0.28);
    transform: none;
  }
  .sys-msg-text {
    font-size: 11px; color: var(--text-tertiary);
    font-family: var(--font-mono);
    transition: opacity 0.3s var(--ease-apple);
  }

  /* ── Error Overlay: Liquid Glass ── */
  .error-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }
  .error-overlay.show {
    display: flex;
    animation: overlayFadeIn 0.35s var(--ease-apple) both;
  }
  .error-box {
    position: relative;
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(14px) saturate(130%);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    border: none;
    border-radius: 20px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 32px 80px -16px rgba(0,0,0,0.12);
    animation: overlayBoxScale 0.4s var(--ease-apple) 0.1s both;
    overflow: hidden;
  }
  .error-box::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 20px;
    pointer-events: none;
    box-shadow:
      inset 1px 1px 0px 0px rgba(255,255,255,0.6),
      inset -1px -1px 0px 0px rgba(255,255,255,0.4);
    background:
      radial-gradient(circle at top left, rgba(255,255,255,0.25), transparent 30%),
      radial-gradient(circle at bottom right, rgba(255,255,255,0.1), transparent 25%);
  }
  .error-box h2 {
    color: var(--red);
    font-size: 20px; font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }
  .error-box p {
    color: var(--text-secondary);
    font-size: 14px; line-height: 1.5;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>骑手前向安全预警</h1>
  <div class="header-right">
    <span class="status-pill" id="conn-pill">
      <span class="status-pill-dot" id="conn-dot"></span>
      <span id="conn-text">已连接</span>
    </span>
  </div>
</div>

<!-- Main Area -->
<div class="main">

  <!-- Left: Camera Feed -->
  <div class="video-col">
    <div class="video-wrapper" id="video-wrapper">
      <img src="/video_annotated_feed" alt="Camera" id="video-img">
      <canvas id="overlay-canvas"></canvas>
    </div>
    <div class="video-label">
      <span>画面模式：</span>
      <button id="btn-video-mode" class="video-mode-btn active" onclick="toggleVideoMode()">
        视觉增强
      </button>
    </div>
  </div>

  <!-- Right: Liquid Glass Panel -->
  <div class="panel-wrapper">
    <div class="panel">

      <!-- Risk Score -->
      <div class="card risk-main">
        <div class="card-title">综合风险评分</div>
        <div class="risk-score" id="risk-score">0.50</div>
        <div class="risk-level-badge low" id="risk-badge">低风险</div>
        <div class="risk-bar-track">
          <div class="risk-bar-fill" id="risk-bar" style="width:50%; background:var(--green);"></div>
        </div>
      </div>

      <!-- Risk Breakdown -->
      <div class="card">
        <div class="card-title">风险分解</div>
        <div id="risk-items-container"></div>
      </div>

      <!-- Sensor Status -->
      <div class="card">
        <div class="card-title">传感器状态</div>
        <div id="sensors-container"></div>
      </div>

      <!-- Real sensor data -->
      <div class="card" id="sensor-data-card">
        <div class="card-title">实时传感器数据</div>
        <div id="sensor-data-container"></div>
      </div>

      <!-- Mode -->
      <div class="card">
        <div class="card-title">运行模式</div>
        <div class="mode-row">
          <span class="sensor-indicator mock"></span>
          <span id="mode-text" style="font-family:var(--font-mono); font-size:13px;">mock</span>
        </div>
      </div>

      <!-- Vision Perception -->
      <div class="card" id="vision-card">
        <div class="card-title">视觉感知结果</div>
        <div id="vision-details-container"></div>
      </div>

      <!-- Runtime -->
      <div class="card" id="runtime-card">
        <div class="card-title">运行状态</div>
        <div id="runtime-container"></div>
      </div>

      <!-- System Message -->
      <div class="card sys-msg-card">
        <span class="sys-msg-text" id="sys-msg">dashboard initialized</span>
      </div>

    </div>
  </div>

</div>

<!-- Error Overlay -->
<div class="error-overlay" id="error-overlay">
  <div class="error-box">
    <h2>后端连接异常</h2>
    <p>无法获取系统状态数据，请检查 Dashboard 服务是否正常运行。</p>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let errorCount = 0;
  const MAX_ERRORS = 3;
  let prevRiskLevel = -1;

  const sensorNames = ["camera", "vision", "radar", "gps"];
  const sensorLabels = {"camera":"摄像头","vision":"视觉","radar":"雷达","gps":"GPS"};
  const riskItemNames = ["obs", "dist", "pose", "speed"];
  const riskItemLabels = {"obs":"视觉风险","dist":"距离风险","pose":"姿态风险","speed":"速度风险"};

  const itemsContainer = $("risk-items-container");
  const ids = {};
  riskItemNames.forEach(k => {
    const div = document.createElement("div");
    div.className = "risk-item-row";
    div.innerHTML =
      '<span class="risk-item-label">' + riskItemLabels[k] + '</span>' +
      '<div class="risk-item-bar"><div class="risk-item-fill" id="item-fill-' + k + '"></div></div>' +
      '<span class="risk-item-val" id="item-val-' + k + '">0.00</span>';
    itemsContainer.appendChild(div);
    ids[k + "_fill"] = "item-fill-" + k;
    ids[k + "_val"] = "item-val-" + k;
  });

  const sensorsContainer = $("sensors-container");
  sensorNames.forEach(k => {
    const div = document.createElement("div");
    div.className = "sensor-row";
    div.innerHTML =
      '<span class="sensor-left"><span class="sensor-indicator off" id="sen-dot-' + k + '"></span>' + sensorLabels[k] + '</span>' +
      '<span class="sensor-mode" id="sen-mode-' + k + '">mock</span>';
    sensorsContainer.appendChild(div);
  });

  const sensorDataFields = ["radar_targets", "radar_nearest", "radar_ttc", "gps_speed", "gps_position", "gps_fix"];
  const sensorDataLabels = {"radar_targets":"雷达目标数","radar_nearest":"最近距离","radar_ttc":"最小 TTC","gps_speed":"GPS 速度","gps_position":"经纬度","gps_fix":"定位质量"};
  const sensorDataIds = {};
  const sensorDataContainer = $("sensor-data-container");
  sensorDataFields.forEach(k => {
    const div = document.createElement("div");
    div.className = "sensor-row";
    div.innerHTML =
      '<span class="sensor-label">' + sensorDataLabels[k] + '</span>' +
      '<span class="sensor-mode" id="sensor-data-' + k + '">--</span>';
    sensorDataContainer.appendChild(div);
    sensorDataIds[k] = "sensor-data-" + k;
  });

  const visionFields = ["valid","object_count","person_count","vehicle_count","max_confidence","drivable_area_ratio"];
  const visionFieldLabels = {"valid":"Vision 有效","object_count":"目标数量","person_count":"行人数量","vehicle_count":"车辆数量","max_confidence":"最高置信度","drivable_area_ratio":"可行驶区域比例"};
  const visionFieldBars = {"max_confidence":true,"drivable_area_ratio":true};
  const vdIds = {};
  const vdContainer = $("vision-details-container");
  visionFields.forEach(k => {
    const div = document.createElement("div");
    div.className = "vd-row";
    if (visionFieldBars[k]) {
      div.innerHTML =
        '<span class="vd-label">' + visionFieldLabels[k] + '</span>' +
        '<div class="vd-bar"><div class="vd-bar-fill" id="vd-bar-' + k + '"></div></div>' +
        '<span class="vd-val" id="vd-val-' + k + '">0.00</span>';
      vdIds[k + "_bar"] = "vd-bar-" + k;
    } else {
      div.innerHTML =
        '<span class="vd-label">' + visionFieldLabels[k] + '</span>' +
        '<span class="vd-val" id="vd-val-' + k + '">-</span>';
    }
    vdContainer.appendChild(div);
    vdIds[k + "_val"] = "vd-val-" + k;
  });

  const runtimeFields = ["backend_uptime_sec","state_hz","last_update_time","camera_available","vision_enabled","vision_status","object_count","state_loop_ms","vision_infer_ms","approx_state_fps"];
  const runtimeLabels = {
    "backend_uptime_sec":"后端运行时长","state_hz":"状态更新频率","last_update_time":"最后更新时间",
    "camera_available":"摄像头状态","vision_enabled":"Vision 启用","vision_status":"Vision 状态",
    "object_count":"当前目标数量","state_loop_ms":"状态循环耗时","vision_infer_ms":"Vision 推理耗时","approx_state_fps":"近似状态 FPS"
  };
  const rtIds = {};
  const rtContainer = $("runtime-container");
  runtimeFields.forEach(k => {
    const div = document.createElement("div");
    div.className = "vd-row";
    div.innerHTML =
      '<span class="vd-label">' + runtimeLabels[k] + '</span>' +
      '<span class="vd-val" id="rt-val-' + k + '">--</span>';
    rtContainer.appendChild(div);
    rtIds[k + "_val"] = "rt-val-" + k;
  });

  function drawOverlay(vd) {
    const canvas = $("overlay-canvas");
    const img = $("video-img");
    if (!canvas || !img) return;
    const ctx = canvas.getContext("2d");
    const dw = img.clientWidth; const dh = img.clientHeight;
    if (dw <= 0 || dh <= 0) return;
    const wrapper = $("video-wrapper");
    if (wrapper) { canvas.width = wrapper.clientWidth; canvas.height = wrapper.clientHeight; }
    else { canvas.width = dw; canvas.height = dh; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const objects = vd.objects;
    if (!objects || objects.length === 0) return;
    const fs = vd.frame_size || {width:640,height:480};
    const nW = fs.width; const nH = fs.height;
    const asp = nW/nH; const casp = canvas.width/canvas.height;
    let rW,rH,oX,oY;
    if (asp > casp) { rW=canvas.width; rH=canvas.width/asp; oX=0; oY=(canvas.height-rH)/2; }
    else { rH=canvas.height; rW=canvas.height*asp; oX=(canvas.width-rW)/2; oY=0; }
    const sX=rW/nW; const sY=rH/nH;
    objects.forEach(function(obj) {
      const b=obj.bbox; if (!b||b.length<4) return;
      const x1=oX+b[0]*sX,y1=oY+b[1]*sY,x2=oX+b[2]*sX,y2=oY+b[3]*sY;
      const w=x2-x1,h=y2-y1; if(w<=0||h<=0) return;
      const risk=typeof obj.risk==="number"?obj.risk:0;
      let c; if(risk<0.3) c="#34c759"; else if(risk<0.7) c="#ff9500"; else c="#ff3b30";
      ctx.strokeStyle=c; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.strokeRect(x1,y1,w,h);
      const lbl=obj.class_name+" "+(obj.confidence*100).toFixed(0)+"%"+(risk>0?" R:"+risk.toFixed(2):"");
      ctx.font="600 12px "+getComputedStyle(document.body).fontFamily;
      const tw=ctx.measureText(lbl).width+12,th=22,ly2=y1-th-3,dy=ly2>0?ly2:y1+3;
      const r=6,lx=x1,ly=dy,lw=Math.min(tw,w+12),lh=th;
      ctx.fillStyle="rgba(0,0,0,0.55)"; ctx.beginPath();
      ctx.moveTo(lx+r,ly); ctx.lineTo(lx+lw-r,ly); ctx.quadraticCurveTo(lx+lw,ly,lx+lw,ly+r);
      ctx.lineTo(lx+lw,ly+lh-r); ctx.quadraticCurveTo(lx+lw,ly+lh,lx+lw-r,ly+lh);
      ctx.lineTo(lx+r,ly+lh); ctx.quadraticCurveTo(lx,ly+lh,lx,ly+lh-r);
      ctx.lineTo(lx,ly+r); ctx.quadraticCurveTo(lx,ly,lx+r,ly); ctx.closePath(); ctx.fill();
      ctx.fillStyle=c; ctx.textBaseline="middle";
      ctx.fillText(lbl,lx+8,ly+lh/2,Math.min(w-8,tw-16));
    });
  }

  function toggleVideoMode() {
    var btn=$('btn-video-mode'),img=$('video-img');
    if(btn.classList.contains('active')){btn.classList.remove('active');btn.textContent='原始画面';img.src='/video_feed';}
    else{btn.classList.add('active');btn.textContent='视觉增强';img.src='/video_annotated_feed';}
  }
  window.toggleVideoMode = toggleVideoMode;

  async function update() {
    try {
      const resp = await fetch("/api/state");
      if (!resp.ok) throw new Error("HTTP "+resp.status);
      const s = await resp.json();

      const scoreEl = $("risk-score");
      scoreEl.textContent = s.risk_score.toFixed(2);
      const pct = (s.risk_score*100).toFixed(1)+"%";

      const badge=$("risk-badge"),bar=$("risk-bar");
      if (s.risk_level !== prevRiskLevel) {
        scoreEl.classList.remove("pulse"); void scoreEl.offsetWidth; scoreEl.classList.add("pulse");
        badge.style.transform="scale(0.85)"; badge.style.opacity="0";
        setTimeout(function(){
          if(s.risk_level===0){badge.textContent="低风险";badge.className="risk-level-badge low";bar.style.background="var(--green)";}
          else if(s.risk_level===1){badge.textContent="中风险";badge.className="risk-level-badge med";bar.style.background="var(--orange)";}
          else{badge.textContent="高风险";badge.className="risk-level-badge high";bar.style.background="var(--red)";}
          badge.style.transform="scale(1)";badge.style.opacity="1";
        },150);
        prevRiskLevel = s.risk_level;
      }
      bar.style.width = pct;

      riskItemNames.forEach(k=>{const v=s.risk_items[k]||0;$(ids[k+"_fill"]).style.width=(v*100).toFixed(1)+"%";$(ids[k+"_val"]).textContent=v.toFixed(2);});

      const sensors=s.sensors||{};
      sensorNames.forEach(k=>{
        const val=sensors[k],dot=$("sen-dot-"+k),modeEl=$("sen-mode-"+k);
        if(val===true||(typeof val==="boolean"&&val)){dot.className="sensor-indicator on";modeEl.textContent="real";modeEl.style.color="var(--green)";}
        else if(val===false||(typeof val==="boolean"&&!val)){dot.className="sensor-indicator off";modeEl.textContent="off";modeEl.style.color="var(--red)";}
        else if(val==="real"){dot.className="sensor-indicator on";modeEl.textContent="real";modeEl.style.color="var(--green)";}
        else if(val==="off"||val==="invalid"){dot.className="sensor-indicator off";modeEl.textContent=String(val);modeEl.style.color="var(--red)";}
        else{dot.className="sensor-indicator mock";modeEl.textContent=String(val);modeEl.style.color="var(--yellow)";}
      });

      $("mode-text").textContent = s.mode || "mock";

      const rd=s.radar_data||{}, gd=s.gps_data||{};
      $(sensorDataIds.radar_targets).textContent=rd.target_count!=null?String(rd.target_count):"--";
      $(sensorDataIds.radar_nearest).textContent=rd.nearest_distance_m>=0?rd.nearest_distance_m.toFixed(1)+" m":"无目标";
      $(sensorDataIds.radar_ttc).textContent=rd.min_ttc_s>0?rd.min_ttc_s.toFixed(1)+" s":"--";
      $(sensorDataIds.gps_speed).textContent=typeof gd.speed_kmh==="number"?gd.speed_kmh.toFixed(1)+" km/h":"--";
      $(sensorDataIds.gps_position).textContent=gd.valid?gd.latitude.toFixed(6)+", "+gd.longitude.toFixed(6):"未定位";
      $(sensorDataIds.gps_fix).textContent=gd.fix_quality!=null?String(gd.fix_quality):"--";

      const vd=s.vision_details||{};
      visionFields.forEach(k=>{
        const el=$(vdIds[k+"_val"]);if(!el)return;
        if(k==="valid"){el.textContent=vd.valid?"是":"否";el.style.color=vd.valid?"var(--green)":"var(--red)";}
        else if(typeof vd[k]==="number"){el.textContent=vd[k].toFixed(2);}
        else{el.textContent=String(vd[k]!=null?vd[k]:"-");}
        if(visionFieldBars[k]){const bar=$(vdIds[k+"_bar"]);if(bar&&typeof vd[k]==="number"){bar.style.width=(vd[k]*100).toFixed(1)+"%";}}
      });

      const rt=s.runtime||{};
      runtimeFields.forEach(k=>{
        const el=$(rtIds[k+"_val"]);if(!el)return;const v=rt[k];
        if(k==="backend_uptime_sec"&&typeof v==="number"){const secs=Math.floor(v);const hh=Math.floor(secs/3600);const mm=Math.floor((secs%3600)/60);const ss=secs%60;el.textContent=String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");}
        else if(k==="state_hz"&&typeof v==="number"){el.textContent=v+" Hz";}
        else if(k==="camera_available"||k==="vision_enabled"){el.textContent=v?"是":"否";el.style.color=v?"var(--green)":"var(--red)";}
        else if(k==="vision_status"){el.textContent=String(v!=null?v:"--");if(v==="real")el.style.color="var(--green)";else if(v==="off")el.style.color="var(--red)";else if(v==="mock")el.style.color="var(--yellow)";else el.style.color="var(--text-tertiary)";}
        else if(k==="state_loop_ms"&&typeof v==="number"){el.textContent=v.toFixed(2)+" ms";}
        else if(k==="vision_infer_ms"&&typeof v==="number"){el.textContent=v.toFixed(2)+" ms";}
        else if(k==="approx_state_fps"&&typeof v==="number"){el.textContent=v.toFixed(2)+" FPS";}
        else if(typeof v==="number"){el.textContent=String(v);}
        else{el.textContent=String(v!=null?v:"--");}
      });

      if(s.message){const msgEl=$("sys-msg");msgEl.style.opacity="0";setTimeout(function(){msgEl.textContent=s.message;msgEl.style.opacity="1";},150);}

      errorCount=0;
      $("conn-pill").classList.remove("offline");
      $("conn-dot").className="status-pill-dot";
      $("conn-text").textContent="已连接";
      $("error-overlay").classList.remove("show");
    } catch(e) {
      errorCount++;
      if(errorCount>=MAX_ERRORS){
        $("conn-pill").classList.add("offline");
        $("conn-dot").className="status-pill-dot";
        $("conn-text").textContent="连接异常";
        $("error-overlay").classList.add("show");
      }
    }
  }

  update();
  setInterval(update, 500);
})();
</script>
</body>
</html>

# ============================================================
#  传感器端口配置
# ============================================================
#  区分 windows（开发调试）和 dk2500（部署运行）两个 profile。
#  通过 config.yaml 中的 system.platform 字段选择。

windows:
  gps:
    port: "COM5"
    baudrate: 9600
    timeout: 1.0
    max_sentence_age_sec: 2.5

  imu:
    port: "COM8"
    baudrate: 115200
    timeout: 0.1

  radar:
    model: "HLK-LD2451"
    port: "COM5"       # 个人Windows开发机已实测
    baudrate: 256000    # 当前这颗雷达的实测波特率
    timeout: 0.5
    # 2026-07-11真机标定：左前靠近原始上报为正角、方向码01。
    approaching_direction_code: 1
    angle_sign: -1  # 统一项目坐标：左负、右正

  motor:
    i2c_bus: 3
    driver_address: "0x5A"

dk2500:
  gps:
    port: "/dev/ttyGPSNEO"        # 通过udev规则固定：NEO-M8N，波特率9600，输出NMEA
    baudrate: 9600
    timeout: 1.0
    max_sentence_age_sec: 2.5

  imu:
    port: "/dev/ttyIMUWT61C"      # 待连接：WT61C IMU，需通过udev规则固定
    baudrate: 115200
    timeout: 0.1

  radar:
    model: "HLK-LD2451"
    port: "/dev/ttyRadarLD2451"   # 通过udev规则固定：LD2451雷达，波特率256000，输出F4F3F2F1帧
    baudrate: 256000
    timeout: 0.5
    # 方向/角度来自雷达前向安装标定，与连接Windows还是DK2500无关。
    approaching_direction_code: 1
    angle_sign: -1

  motor:
    i2c_bus: 1
    driver_address: "0x5A"

# 摄像头配置（与端口无关，放在这里统一管理）
camera:
  device_id: 1         # 实测：内置摄像头为0，外接Logitech C910为1
  width: 640
  height: 480
  fps: 30

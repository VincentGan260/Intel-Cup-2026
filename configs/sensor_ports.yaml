# ============================================================
#  传感器端口配置
# ============================================================
#  区分 windows（开发调试）和 dk2500（部署运行）两个 profile。
#  通过 config.yaml 中的 system.platform 字段选择。

windows:
  gps:
    port: "COM5"
    baudrate: 9600
    timeout: 1.0
    max_sentence_age_sec: 2.5

  imu:
    port: "COM8"
    baudrate: 115200
    timeout: 0.1

  radar:
    model: "HLK-LD2451"
    port: "COM5"       # 个人Windows开发机已实测
    baudrate: 256000    # 当前这颗雷达的实测波特率
    timeout: 0.5
    # 2026-07-11真机标定：左前靠近原始上报为正角、方向码01。
    approaching_direction_code: 1
    angle_sign: -1  # 统一项目坐标：左负、右正

  motor:
    i2c_bus: 3
    driver_address: "0x5A"

dk2500:
  gps:
    port: "/dev/ttyS5"           # 当前上车接线使用主板UART；GPS失效时仍作为可选模态记录valid=false
    baudrate: 9600
    timeout: 1.0
    max_sentence_age_sec: 2.5

  radar:
    model: "HLK-LD2451"
    port: "/dev/ttyRadarLD2451"  # udev稳定链接，实测指向/dev/ttyUSB1
    baudrate: 256000       # 同一颗雷达迁移上板时保持；若恢复出厂则为115200
    timeout: 0.5
    # 方向/角度来自雷达前向安装标定，与连接Windows还是DK2500无关。
    approaching_direction_code: 1
    angle_sign: -1

  motor:
    i2c_bus: 3
    driver_address: "0x5A"

# 摄像头配置（与端口无关，放在这里统一管理）
camera:
  device_id: 0         # DK2500外接Logitech C910主视频节点；video1为附属节点，实测无法稳定采集
  width: 640
  height: 480
  fps: 30

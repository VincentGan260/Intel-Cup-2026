# ============================================================
#  传感器端口配置
# ============================================================
#  区分 windows（开发调试）和 dk2500（部署运行）两个 profile。
#  通过 config.yaml 中的 system.platform 字段选择。

windows:
  gps:
    model: "WHEELTEC G60"
    port: "auto"               # 按 USB VID:PID 1a86:55d4 自动识别
    baudrate: 9600
    max_sentence_age_sec: 2.5

  imu:
    port: "COM8"
    baudrate: 115200
    timeout: 0.1

  radar:
    model: "HLK-LD2451"
    port: "COM5"       # 个人Windows开发机已实测
    baudrate: 256000    # 当前这颗雷达的实测波特率
    timeout: 0.5
    # 2026-07-11真机标定：左前靠近原始上报为正角、方向码01。
    approaching_direction_code: 1
    angle_sign: -1  # 统一项目坐标：左负、右正

  motor:
    i2c_bus: 3
    driver_address: "0x5A"

dk2500:
  gps:
    model: "WHEELTEC G60"
    port: "auto"               # USB Type-C，Linux 通常映射为 /dev/ttyACM*
    baudrate: 9600
    max_sentence_age_sec: 2.5

  imu:
    # 2026-07-19 DK2500 实测：WT61C 位于 USB 6.4，当前映射 /dev/ttyUSB1。
    port: "/dev/serial/by-path/pci-0000:00:14.0-usb-0:6.4:1.0-port0"
    baudrate: 115200
    timeout: 0.1
    max_data_age_sec: 0.5
    # 回退镜像值；正式风险规则以 warning_rules.yaml 为版本化权威来源。
    # 2026-07-18 水平静止实测（993帧）：X前、Y左、Z上。
    roll_offset_deg: -0.231277
    pitch_offset_deg: -0.518034

  radar:
    model: "HLK-LD2451"
    # 2026-07-19 DK2500 实测：LD2451 位于 USB 6.3，当前映射 /dev/ttyUSB0。
    # 不使用旧的 /dev/ttyRadarLD2451；主机上的遗留 udev 规则误指向 IMU 的 USB 6.4。
    port: "/dev/serial/by-path/pci-0000:00:14.0-usb-0:6.3:1.0-port0"
    baudrate: 256000       # 同一颗雷达迁移上板时保持；若恢复出厂则为115200
    timeout: 0.5
    # 方向/角度来自雷达前向安装标定，与连接Windows还是DK2500无关。
    approaching_direction_code: 1
    angle_sign: -1

  motor:
    i2c_bus: 3
    driver_address: "0x5A"

# 摄像头配置（与端口无关，放在这里统一管理）
camera:
  device_id: 0         # DK2500外接Logitech C910主视频节点；video1为附属节点，实测无法稳定采集
  width: 640
  height: 480
  fps: 30

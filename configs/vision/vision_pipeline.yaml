# 视觉最小闭环：检测 + 分割 + 视觉风险初判
# 子配置路径均为相对项目根目录。

# 输入图像（URL 或相对路径）
source: https://ultralytics.com/images/bus.jpg

# 是否启用语义分割（关闭时仅做检测 + 视觉风险，in_drivable_area 为 None）
enable_segmentation: true
enable_parallel_inference: true

# 检测与分割处理同一帧，分别在 NPU/GPU 上同时执行。
# 这是所有 VisionAdapter 正式入口共用的全局设置，不是测试脚本专用开关。
execution:
  parallel_inference: true

# Dashboard 正式推理部署契约；VisionAdapter 启动时会校验，避免配置漂移。
deployment_contract:
  detection: {precision: INT8, device: NPU}
  segmentation: {precision: FP16, device: GPU}

# 子模块配置文件路径
# Segmentation profile: 1 = white-tile model, 2 = original ADAS model.
# Edit this one number, then restart the vision process.
segmentation_model: 1
segmentation_profiles:
  1: configs/vision/segmentation_white_tile_fp16.yaml
  2: configs/vision/segmentation_adas_fp16.yaml

detection_config: configs/vision/detection.yaml
# Legacy fallback for tools that do not support segmentation_profiles yet.
segmentation_config: configs/vision/segmentation_white_tile_fp16.yaml

output:
  # 是否保存带检测框的调试图
  save_debug_image: false
  # 与 detection / segmentation 同属 runs/vision/
  debug_image_path: runs/vision/pipeline/debug.jpg

# =============================================================================
# 视觉测试统一配置（精度 + 延迟）
# -----------------------------------------------------------------------------
# 所有路径、采样数、标签约定都放这里，代码里不写死。
# 机器路径不同：复制本文件为 eval.local.yaml，只写你要改的项（支持嵌套覆盖，
#   不进 git，互不冲突）。命令行参数优先级最高。
# 相对路径以「项目根目录」为基准；也可写绝对路径（如 D:/... 、E:/...）。
#
# 想知道哪些路径还没准备好：跑
#   conda run -n intel python scripts/vision/check_eval_paths.py
# 它会逐项 ✓/✗ 告诉你缺什么。
# =============================================================================

# -------------------------- 检测精度评测 --------------------------
detection:
  # ↓↓↓ 改成你本地 BDD 图片和逐图 JSON 标注的目录 ↓↓↓
  images_dir: datasets/bdd100k/images/100k/val
  labels_dir: datasets/bdd100k/labels/100k/val      # 逐图 *.json（旧格式）
  num_samples: 200                                  # 评多少张；先小后大
  iou_thr: 0.5
  conf_operating_point: 0.25                        # 报 P/R/F1 的部署置信度
  # 障碍物 = 这些类（类别无关匹配，但只算这些）
  obstacle_classes: [car, bus, truck, pedestrian, rider, bike, motor]
  # 这些类排除（不是障碍物，避免冤枉成漏检/误报）
  exclude_classes:  [traffic sign, traffic light, train]

# -------------------------- 分割精度评测（road IoU）--------------------------
# ⚠️ 旧参考段：现行分割评测走 scripts/vision/eval_seg.py（manifest 驱动 + tools/unify_seg_labels.to_road_mask
#    统一标签），不再读取下面的 datasets glob 配置。本段仅作历史参考；如要复用旧式 glob 评测，
#    务必照下面已修正的后缀/road_value（尤其 ACDC 用 _gt_labelTrainIds(road=0)，不是 _gt_invIds）。
segmentation:
  num_samples: 200
  input_hw: [512, 896]        # road-adas 输入；PIDNet 由各自模型决定，脚本会处理
  datasets:
    - name: bdd100k
      images_dir: datasets/seg/bdd100k/images/10k/val
      labels_dir: datasets/seg/bdd100k/labels/bdd100k_seg_maps/labels/val
      # BDD100K trainIds 格式：road=0
      label_suffix: _train_id.png
      image_suffix: .jpg
      road_value: 0
      ignore_value: 255
      recursive: false
    - name: idd
      images_dir: datasets/seg/idd/leftImg8bit/val
      labels_dir: datasets/seg/idd/gtFine/val
      # IDD 标注格式：*_image.jpg → *_label.png，road=0（trainIds 格式）
      label_suffix: _label.png
      image_suffix: _image.jpg
      road_value: 0
      ignore_value: 255
      recursive: true
    - name: acdc
      # 修正：覆盖全部天气（fog/night/rain/snow），用语义 labelTrainIds（road=0）
      # 原配置用 _gt_invIds.png+road_value:1 是错的——invIds 是「无效区域掩码」不是道路
      images_dir: datasets/seg/acdc/rgb_anon_trainvaltest/rgb_anon
      labels_dir: datasets/seg/acdc/gt_trainval/gt
      label_suffix: _gt_labelTrainIds.png
      image_suffix: _rgb_anon.png
      road_value: 0
      ignore_value: 255
      recursive: true
    - name: cityscapes
      images_dir: datasets/seg/cityscapes/leftImg8bit_trainvaltest/leftImg8bit/val
      labels_dir: datasets/seg/cityscapes/gtFine_trainvaltest/gtFine/val
      # Cityscapes 标注格式：*_leftImg8bit.png → *_gtFine_labelIds.png，road=7（labelIds 格式）
      label_suffix: _gtFine_labelIds.png
      image_suffix: _leftImg8bit.png
      road_value: 7
      ignore_value: 255
      recursive: true          # cityscapes 有子目录
    - name: camvid
      images_dir: datasets/CamVid/test
      labels_dir: datasets/CamVid/test_labels
      # CamVid 标注格式：*.png → *_L.png，RGB颜色编码，Road的RGB=(128,64,128)
      label_suffix: _L.png
      image_suffix: .png
      road_rgb: [128, 64, 128]   # RGB格式的road颜色（注意：cv2读取是BGR，但这里按CSV写RGB）
      road_value: 255             # RGB处理后road像素值为255
      ignore_value: -1            # CamVid没有ignore区域，设为不存在的值
      recursive: false

# -------------------------- 模型（各精度路径）--------------------------
models:
  detection:
    # ★ 已切微调 v2（部署模型）。基础 COCO 版结果见 det_obstacle_base_v2m.json（基线已存档）。
    pytorch: runs/finetune/yolo26n_obstacle_v2/weights/best.pt    # 微调 v2（一致性抽查/再导出用）
    fp32:    models/yolo26n_v2_openvino_model/best.xml            # 微调 v2 FP32（精度/部署）
    fp16:    models/yolo26n_v2_fp16_openvino_model/best.xml       # 微调 v2 FP16（端侧延迟轮）
    int8:    models/yolo26n_int8_openvino_model/yolo26n.xml       # 量化产出（重跑量化轮后更新）
  segmentation:
    pidnet_fp32:   models/openvino/pidnet-s/pidnet-s.xml
    pidnet_fp16:   models/openvino/pidnet-s-fp16/pidnet-s.xml      # FP16 转换产出
    pidnet_int8:   models/openvino/pidnet-s-int8/pidnet-s.xml      # 量化后产出（暂不存在）
    road_adas:      models/openvino/road-segmentation-adas-0001/road-segmentation-adas-0001.xml
    road_adas_fp16: models/openvino/road-adas-fp16/road-segmentation-adas-0001.xml  # FP16 转换产出
    road_adas_int8: models/openvino/road-adas-int8/road-segmentation-adas-0001.xml  # INT8 量化产出

# -------------------------- 量化（INT8，开发机就能做）--------------------------
quantization:
  calib_images_dir: datasets/bdd100k/images/100k/val   # 校准图，无需标注
  calib_count: 200

# -------------------------- 延迟（必须上 DK-2500 跑）--------------------------
latency:
  devices: [CPU, GPU, NPU]
  warmup: 20
  iters: 200
  realtime_floor_fps: 10

# -------------------------- 输出 --------------------------
output:
  accuracy_dir: runs/accuracy_eval
  latency_dir:  runs/latency_eval

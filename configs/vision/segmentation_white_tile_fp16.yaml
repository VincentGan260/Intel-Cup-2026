# Competition-site white-tile road segmentation (DeepLabV3-MobileNetV3, binary).
# Reuses the generic normalized-logits OpenVINO segmenter implementation.
backend: pidnet_openvino

model:
  xml_path: models/openvino/white-tile-road-fp16/white-tile-road.xml
  input_height: 512
  input_width: 896
  class_names:
    - background
    - road
  road_class_index: 1

openvino:
  device: GPU
  inference_precision: FP16

visualization:
  alpha: 0.45
  drivable_color_bgr: [0, 200, 0]

output:
  overlay_path: runs/vision/white_tile_deeplab/overlay.jpg

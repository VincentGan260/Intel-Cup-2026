# ============================================================
#  系统总配置
# ============================================================
#  所有系统级参数集中管理，各模块代码中不写死路径或开关。

system:
  # 运行模式：real（真实硬件）/ mock（模拟数据，无硬件时测试流程）
  mode: real

  # 目标主循环频率（Hz），融合线程以此为基准
  main_loop_hz: 20

  # 硬件运行平台，用于自动选择 sensor_ports.yaml 中的 profile
  # 可选：windows / dk2500
  platform: windows

  # 调试模式：开启后控制台输出更详细的状态
  debug: true

  # 每一帧数据缺失允许的最大秒数，超过则该模块标记为 invalid
  sensor_timeout_sec: 2.0

# ============================================================
#  日志配置
# ============================================================

logging:
  enabled: true

  # 日志输出目录（相对项目根目录）
  dir: logs

  # CSV 日志文件名
  file: system_log.csv

  # 日志写入间隔（秒），避免高频 I/O
  write_interval_sec: 0.5

# ============================================================
#  可视化配置
# ============================================================

visualization:
  # 是否开启 OpenCV 可视化窗口（需要显示器）
  enabled: true

  # 窗口名称
  window_name: "Rider Warning System"

  # 输出截图保存到 outputs/ 目录
  save_screenshot: true
  screenshot_dir: outputs
